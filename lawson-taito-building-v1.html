scene.add(new T.HemisphereLight(0xe4efff,0x51402d,2.2));let sun=new T.DirectionalLight(0xffe1b9,3.1);sun.position.set(-12,24,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);

function box(parent,x,y,z,w,h,d,m,bevel=0){let g=new T.BoxGeometry(w,h,d);let o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function sphere(parent,x,y,z,r,m,sx=1,sy=1,sz=1,seg=20){let o=new T.Mesh(new T.SphereGeometry(r,seg,Math.max(8,seg-4)),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;parent.add(o);return o}
function cylinder(parent,x,y,z,r1,r2,h,m,axis='y'){let o=new T.Mesh(new T.CylinderGeometry(r1,r2,h,24),m);o.position.set(x,y,z);if(axis==='x')o.rotation.z=Math.PI/2;if(axis==='z')o.rotation.x=Math.PI/2;o.castShadow=true;parent.add(o);return o}
function label(parent,text,x,y,z,w,h,bg,fg='#fff',rotY=0){let c=document.createElement('canvas');c.width=1024;c.height=256;let q=c.getContext('2d');q.fillStyle=bg;q.fillRect(0,0,1024,256);q.fillStyle=fg;q.font='900 116px Arial';q.textAlign='center';q.textBaseline='middle';q.fillText(text,512,130);let tx=new T.CanvasTexture(c);tx.colorSpace=T.SRGBColorSpace;let m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tx}));m.position.set(x,y,z);m.rotation.y=rotY;parent.add(m);return m}
const city=new T.Group();scene.add(city);

for(let y=7.55;y<=12.65;y+=.36)box(city,4.94,y,4.45, .025,.025,8.1,mat(0x9e9287));

// roof sign frame and panels

box(city,1.6,14.25,4.2,4.35,1.38, .05,mat(0xe5f0e5));label(city,'🍀 ITO EN',1.6,14.25,4.24,3.9,.85,'#dcefe0','#15251c');

for(let x of [-.2,1.65]){box(city,x,10.5,8.78,.95,2.35,.18,black);sphere(city,x,11.55,8.9,.48,yellow,.95,.6,.2);sphere(city,x-.13,10.1,8.91,.12,black);sphere(city,x+.13,10.1,8.91,.12,black)}

const ballGroup=new T.Group();ballGroup.position.set(4.95,10.25,7.6);ballGroup.rotation.y=Math.PI/2;city.add(ballGroup);
cylinder(ballGroup,0,0,0,1.85,1.85,.42,mat(0x6d5a60),'z');cylinder(ballGroup,0,0,.25,1.55,1.55,.18,white,'z');cylinder(ballGroup,0,.02,.37,1.34,1.34,.12,red,'z');box(ballGroup,0,0,.47,2.65,.13,.12,black);cylinder(ballGroup,0,0,.56,.38,.38,.18,black,'z');cylinder(ballGroup,0,0,.68,.25,.25,.12,white,'z');
// colorful orbit ring on tower
let ring=new T.Mesh(new T.TorusGeometry(3.5,.22,12,100),mat(0xece7f0,.28));ring.rotation.x=Math.PI/2;ring.position.set(1.65,7.85,4.45);ring.scale.set(1,.72,1);city.add(ring);
for(let i=0;i<12;i++){let a=i/12*Math.PI*2;let colors=[0xff4242,0x3188f5,0xffcf35,0xe78bd2,0x25bb80,0xf2f0ed];sphere(city,1.65+3.5*Math.cos(a),7.9,4.45+2.5*Math.sin(a),.34,mat(colors[i%6],.22),1,1,.72,14)}

const target=new T.Vector3(0,7,0);let theta=.72,phi=1.08,radius=34,drag=false,lastX=0,lastY=0,pinch=0;
function updateCam(){camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}
updateCam();const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!drag)return;theta-=(e.clientX-lastX)*.008;phi=Math.max(.25,Math.min(1.48,phi+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY;updateCam()});
el.addEventListener('pointerup',()=>drag=false);el.addEventListener('pointercancel',()=>drag=false);
el.addEventListener('wheel',e=>{radius=Math.max(19,Math.min(52,radius+e.deltaY*.025));updateCam()},{passive:true});
let touches=new Map();el.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});el.addEventListener('touchmove',e=>{if(e.touches.length===2){let n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch){radius=Math.max(19,Math.min(52,radius+(pinch-n)*.045));updateCam()}pinch=n}},{passive:true});
