<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1100" viewBox="0 0 620 1100">
<defs>
 <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ff75ef"/><stop offset=".45" stop-color="#f000bb"/><stop offset="1" stop-color="#6d087e"/></linearGradient>
