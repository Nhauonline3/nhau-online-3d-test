<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>369 CITY – Phố mua sắm Pixel Neon | Bản thử nghiệm</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b20;font-family:system-ui,-apple-system,sans-serif}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;z-index:3;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.card{background:#07152cf2;color:#fff;border:1px solid #23d8ff;border-radius:12px;padding:10px 13px;box-shadow:0 0 18px #00cfff66,inset 0 0 12px #b000ff22;pointer-events:auto}.card strong{font-size:16px;letter-spacing:.3px}.sub{font-size:10px;color:#9beeff;margin-top:2px}
.hint{position:fixed;z-index:3;left:50%;transform:translateX(-50%);top:88px;background:#07152cf2;color:#fff;padding:9px 13px;border:1px solid #ec37ff;border-radius:10px;font-size:12px;white-space:nowrap;max-width:calc(100vw - 24px);box-shadow:0 0 16px #d000ff66}
.bottom{position:fixed;z-index:3;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:end;gap:8px}.pill{background:#07152cf2;color:white;border:1px solid #24dfff;border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 0 16px #00cfff55;max-width:68%}
button{background:#ec36d9;color:#fff;border:1px solid #ffb9fa;border-radius:10px;padding:11px 13px;font-weight:800;font-size:12px;box-shadow:0 0 16px #e000ff88}
#shopInfo{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:78px;width:min(430px,calc(100vw - 28px));display:none;background:#07152cf5;color:white;border:1px solid #20ddff;border-radius:14px;padding:14px;box-shadow:0 0 24px #00cfff77}
#shopInfo strong{font-size:17px;color:#6df4ff}#shopInfo p{margin:6px 0 10px;font-size:13px;color:#d8e8ff}#closeInfo{float:right;padding:5px 9px}
@media(min-width:700px){.card strong{font-size:20px}.sub,.hint,.pill,button{font-size:14px}}
</style>
</head>
<body>
<div id="scene"></div>
<div class="panel"><div class="card"><strong>🏙️ 369 CITY</strong><div class="sub">PHỐ MUA SẮM · PIXEL NEON V01</div></div><div class="card" style="text-align:right"><strong>🛍️ SHOPPING STREET</strong><div class="sub">8 gian hàng · Bản thử nghiệm</div></div></div>
<div class="hint">Vuốt để xoay · Chụm 2 ngón để phóng to/thu nhỏ · Chạm cửa hàng để xem</div>
<div id="shopInfo"><button id="closeInfo">ĐÓNG</button><strong id="shopTitle">CỬA HÀNG</strong><p id="shopDesc">Thông tin cửa hàng</p></div>
<div class="bottom"><div class="pill">Bản thử nghiệm riêng · Chưa đưa vào game chính</div><button id="reset">ĐẶT LẠI GÓC NHÌN</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const host=document.getElementById('scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0x080d29);scene.fog=new THREE.Fog(0x080d29,65,125);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,220);camera.position.set(32,27,38);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.target.set(0,2,0);controls.minDistance=18;controls.maxDistance=75;controls.maxPolarAngle=Math.PI*.48;controls.minPolarAngle=.18;
scene.add(new THREE.AmbientLight(0xb8cfff,1.45));scene.add(new THREE.HemisphereLight(0x92caff,0x27365d,1.8));const moon=new THREE.DirectionalLight(0xd9e8ff,1.45);moon.position.set(-25,42,22);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.46,metalness:.18}),glow=c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.55,roughness:.35});
const M={ground:mat(0x253b68),road:mat(0x172b50),dark:mat(0x101b3b),wall:mat(0x253766),glass: new THREE.MeshStandardMaterial({color:0x173e70,emissive:0x0a3261,emissiveIntensity:.8,metalness:.45,roughness:.18}),floor:mat(0x435b8d),gold:glow(0xffc34d),cyan:glow(0x19e5ff),pink:glow(0xff28c8),purple:glow(0x913fff),lime:glow(0x7dff7a),white:mat(0xeaf5ff),wood:mat(0x87517d),leaf:mat(0x168c79)};
function box(x,y,z,w,h,d,material,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y+h/2,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function point(x,y,z,color,intensity=1.5,dist=10){const l=new THREE.PointLight(color,intensity,dist);l.position.set(x,y,z);scene.add(l)}
function labelTexture(text,bg='#091632',fg='#ffffff',small=false){const c=document.createElement('canvas');c.width=512;c.height=160;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,512,160);g.strokeStyle='#24dcff';g.lineWidth=7;g.strokeRect(5,5,502,150);g.fillStyle=fg;g.font='bold '+(small?34:46)+'px monospace';g.textAlign='center';g.textBaseline='middle';g.shadowColor=fg;g.shadowBlur=12;g.fillText(text,256,82,470);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshStandardMaterial({map:t,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.42,roughness:.85})}
function sign(parent,x,y,z,w,h,text,accent){box(x,y,z,w+.28,h+.28,.22,M.dark,parent);box(x,y,z+.14,w+.12,h+.12,.08,accent,parent);const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),labelTexture(text,'#091632','#ffffff'));p.position.set(x,y,z+.20);parent.add(p)}
// broad street base, sidewalks and luminous center lane
box(0,-.55,0,110,.5,110,M.ground);box(0,-.18,0,37,.18,64,M.road);box(0,-.02,0,13,.10,64,M.floor);
for(let z=-29;z<=29;z+=2){box(0,.055,z,.11,.025,1.1,z%4===0?M.cyan:M.pink)}
for(const x of [-18.3,18.3]){box(x,.02,0,1.2,.18,64,M.dark);box(x,.14,0,.12,.08,64,x<0?M.cyan:M.pink)}
for(let z=-30;z<=30;z+=5){box(-9.3,.08,z,1.2,.08,2.6,M.dark);box(9.3,.08,z,1.2,.08,2.6,M.dark)}
// pixel-style shops: shop facades face the central avenue
const shopData=[
 {name:'NEON FASHION',desc:'Thời trang và phụ kiện avatar. Khu vực dự kiến cho người chơi thuê gian hàng.',x:-13,z:-19,color:0xff28c8,tag:'FASHION'},
 {name:'369 BEAUTY',desc:'Mỹ phẩm, phụ kiện làm đẹp và vật phẩm trang trí nhân vật.',x:13,z:-19,color:0x18ddff,tag:'BEAUTY'},
 {name:'PIXEL MARKET',desc:'Cửa hàng tổng hợp để trưng bày và bán vật phẩm.',x:-13,z:-6,color:0xffb936,tag:'MARKET'},
 {name:'GAME STORE',desc:'Vật phẩm game, mini game và quà tặng trong thành phố.',x:13,z:-6,color:0x9c4cff,tag:'GAME'},
 {name:'369 FOOD',desc:'Quầy đồ ăn và nước uống phong cách phố đêm.',x:-13,z:7,color:0x18ddff,tag:'FOOD'},
 {name:'DRINK & TEA',desc:'Trà, nước giải khát và máy bán hàng tự động.',x:13,z:7,color:0xff28c8,tag:'DRINK'},
 {name:'KARAOKE BOX',desc:'Phòng karaoke riêng và khu giao lưu bằng giọng nói.',x:-13,z:20,color:0x9c4cff,tag:'KARAOKE'},
 {name:'GIFT & TOYS',desc:'Quà lưu niệm, đồ sưu tầm và vật phẩm trang trí.',x:13,z:20,color:0xffb936,tag:'GIFTS'}
];
const shopMeshes=[];
function shop(d,index){
 const g=new THREE.Group();g.position.set(d.x,0,d.z);scene.add(g);const a=glow(d.color);
 // raised foundation, back wall, side walls and bright roof cornice
 box(0,.22,0,9.5,.45,8.4,M.dark,g);box(0,.52,0,9.15,.12,8.05,a,g);
 box(0,3.25,-3.7,9.1,5.1,.38,M.wall,g);box(-4.45,2.2,0,.32,3.5,7.6,M.dark,g);box(4.45,2.2,0,.32,3.5,7.6,M.dark,g);
 box(0,5.9,-.1,9.8,.34,8.7,M.dark,g);box(0,6.1,-.1,9.95,.16,8.85,a,g);
 // front-facing glowing fascia and large readable sign
 box(0,4.95,3.86,8.9,1.3,.25,M.dark,g);sign(g,0,5.05,4.02,8.25,1.0,d.tag,a);
 // glass shop front panels with mullions and a central door
 for(const x of [-3.0,-1.5,1.5,3.0]){box(x,2.25,3.83,1.28,3.0,.18,M.glass,g);box(x-.68,2.25,3.96,.09,3.05,.08,a,g)}
 box(0,2.15,3.9,1.3,2.9,.24,M.dark,g);box(0,2.2,4.05,1.08,2.55,.08,M.glass,g);box(.38,2.25,4.12,.08,.12,.06,M.gold,g);
 // colorful awning stripe canopy above display windows
 for(let i=0;i<9;i++){const xx=-4+i*.99;box(xx,3.85,4.42,.94,.28,1.25,i%2?a:M.pink,g)}
 // shelves, display cubes and bright window props
 for(let row=0;row<2;row++)for(let k=0;k<5;k++){const xx=-3.6+k*1.8;box(xx,1.05+row*1.15,3.25,.72,.62,.35,k%2?a:M.cyan,g)}
 // pixel display plinths at each corner
 for(const xx of [-3.7,3.7]){box(xx,.72,4.9,1.05,.65,.85,M.purple,g);box(xx,1.12,4.9,.72,.12,.62,a,g)}
 // side-mounted mini LED sign
 sign(g,5.0,3.6,.2,1.2,2.4,d.tag,a);
 // neon side strips and glowing entrance step
 box(0,.56,4.65,2.1,.16,1.1,M.cyan,g);box(0,.7,5.1,3.2,.12,.35,M.pink,g);
 // clickable invisible-ish hit target, plus glow marker
 const hit=new THREE.Mesh(new THREE.BoxGeometry(9.4,6.5,8.2),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));hit.position.set(0,3.1,0);hit.userData.shop=d;g.add(hit);shopMeshes.push(hit);
 const glowLight=new THREE.PointLight(d.color,2.5,14);glowLight.position.set(0,4,5.5);g.add(glowLight);
 // side pixel roof antenna
 for(let k=0;k<3;k++)box(-3.5+k*.35,6.5,-2,.16,.45+(k%2)*.3,.16,k%2?M.pink:M.cyan,g);
}
shopData.forEach(shop);
// street lamps, benches, planters and pixel trees make the avenue feel inhabited without blocking the shops
function lamp(x,z){box(x,0,z,.22,4.5,.22,M.dark);box(x,4.45,z,.82,.38,.82,M.gold);box(x,4.85,z,.6,.35,.6,M.cyan);point(x,4.8,z,0xffb83e,1.7,10)}
function planter(x,z){box(x,.18,z,3.4,.42,1.8,M.dark);box(x,.4,z,3.15,.12,1.55,M.leaf);for(let i=0;i<7;i++){const px=x-1.25+i*.42;box(px,.68,z,.3,.5+(i%3)*.16,.32,i%2?M.lime:M.pink);box(px,.95,z,.18,.18,.18,M.gold)}}
function bench(x,z){box(x,.48,z,2.4,.2,.72,M.wood);box(x,.9,z-.25,2.4,.68,.16,M.wood);for(const dx of [-.85,.85])box(x+dx,.1,z,.16,.75,.16,M.dark)}
for(const z of [-25,-13,-.5,12,25]){lamp(-7.8,z);lamp(7.8,z);planter(-9.5,z);planter(9.5,z)}
for(const z of [-20,-8,5,17]){bench(-5.6,z);bench(5.6,z)}
// floating pixel lantern strings across the street
for(let i=0;i<13;i++){const x=-9+i*1.5;const b=new THREE.Mesh(new THREE.BoxGeometry(.2,.2,.2),i%2?M.pink:M.cyan);b.position.set(x,10,-1+Math.sin(i*.65)*1.2);scene.add(b);point(x,10,-1+Math.sin(i*.65)*1.2,i%2?0xff28c8:0x19e5ff,.28,5)}
// vending kiosks and info board near the midpoint
function vending(x,z,accent,title){const g=new THREE.Group();g.position.set(x,0,z);box(0,1.3,0,1.6,2.6,1.0,M.dark,g);box(0,1.35,.55,1.3,1.8,.08,accent,g);for(let r=0;r<3;r++)for(let c=0;c<3;c++)box(-.42+c*.42,1.9-r*.48,.64,.25,.32,.08,[M.pink,M.cyan,M.gold][(r+c)%3],g);box(0,2.85,.05,1.75,.3,1.1,M.dark,g);sign(g,0,2.9,.58,1.5,.3,title,accent);scene.add(g);point(x,1.6,z+1,0x19e5ff,.8,5)}
vending(-5,0,M.cyan,'DRINKS');vending(5,0,M.pink,'SNACKS');
// overhead 369 CITY wayfinding portal at the far end
box(0,8,-30,13,.35,.7,M.dark);box(0,8.2,-30,13.2,.12,.8,M.pink);const arch=new THREE.Mesh(new THREE.PlaneGeometry(10,.8),labelTexture('369 CITY  •  SHOPPING STREET','#091632','#fff16a'));arch.position.set(0,8,-29.58);scene.add(arch);
for(const x of [-6.4,6.4]){box(x,4.1,-30,.28,7.8,.3,M.cyan);box(x,7.8,-30,.5,.3,.6,M.gold)}
// luminous skyline backdrop, no real people, keep view focused on the shop fronts
for(let i=0;i<12;i++){const x=-30+i*5.4,h=8+(i%4)*3;box(x,h/2,-38,3.8,h,2.8,M.dark);for(let y=1;y<h-1;y+=1.3)for(let k=-1;k<=1;k++)box(x+k*.9,y,-36.48,.48,.55,.08,i%2?M.pink:M.cyan)}
// extra ambient fills for bright readable mobile preview
for(const [x,z,c] of [[-15,-8,0xff28c8],[15,-8,0x19e5ff],[-15,15,0x873cff],[15,15,0xffb936],[0,0,0x328cff]])point(x,8,z,c,2.2,26);
const initial={pos:new THREE.Vector3(32,27,38),target:new THREE.Vector3(0,2,0)};
document.getElementById('reset').onclick=()=>{camera.position.copy(initial.pos);controls.target.copy(initial.target);controls.update()};
document.getElementById('closeInfo').onclick=()=>document.getElementById('shopInfo').style.display='none';
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-(window._downX??e.clientX))>8||Math.abs(e.clientY-(window._downY??e.clientY))>8)return;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(shopMeshes,false);if(hits.length){const d=hits[0].object.userData.shop;document.getElementById('shopTitle').textContent=d.name;document.getElementById('shopDesc').textContent=d.desc;document.getElementById('shopInfo').style.display='block'}});
renderer.domElement.addEventListener('pointerdown',e=>{window._downX=e.clientX;window._downY=e.clientY});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
