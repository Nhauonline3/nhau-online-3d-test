 let ix=pMoveX+(pKeys['d']||pKeys['arrowright']?1:0)-(pKeys['a']||pKeys['arrowleft']?1:0);
 let iy=pMoveY+(pKeys['s']||pKeys['arrowdown']?1:0)-(pKeys['w']||pKeys['arrowup']?1:0);
 const len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}
 // Move along the avenue; the camera's horizontal viewing direction defines forward.
 const dir=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();
 const right=new THREE.Vector3(dir.z,0,-dir.x);
 const move=right.multiplyScalar(ix).add(dir.multiplyScalar(-iy));
 const speed=7.2;const nx=THREE.MathUtils.clamp(player.position.x+move.x*speed*dt,-7.25,7.25);
 const nz=THREE.MathUtils.clamp(player.position.z+move.z*speed*dt,-29.5,29.5);
 player.position.x=nx;player.position.z=nz;
 if(len>.08){player.rotation.y=Math.atan2(move.x,move.z);pWings.forEach((w,i)=>w.rotation.z=(i===0?-.35:.35)+Math.sin(performance.now()*.012)*.16)}
 if(pJumping){pJumpV-=18*dt;player.position.y+=pJumpV*dt;if(player.position.y<=0){player.position.y=0;pJumpV=0;pJumping=false}}
 else if(len>.08)player.position.y=Math.abs(Math.sin(performance.now()*.012))*.035;
 const dx=player.position.x-pPrev.x,dz=player.position.z-pPrev.z;
 if(Math.abs(dx)+Math.abs(dz)>.00001){camera.position.x+=dx;camera.position.z+=dz;controls.target.x+=dx;controls.target.z+=dz;pPrev.copy(player.position)}
 controls.update();
}

const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.72,.62,.16);composer.addPass(bloom);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();updatePlayer();composer.render()}animate();
</script>
